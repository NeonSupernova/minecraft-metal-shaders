name: Release

# Push a tag like v1.0.0-alpha.7 (semantic versioning: vMAJOR.MINOR.PATCH, optional -alpha.N / -beta.N / -rc.N) and this builds the mod on an Apple Silicon runner (the native Metal
# library needs clang + the macOS SDK) and publishes metal-shaders-<version>.jar as a GitHub release.
# If the release already exists (e.g. you made it in the GitHub UI, which also creates the tag), the jar is attached to it.
# Run it by hand (Actions -> Release -> Run workflow) to get a test build as a workflow artifact, no release; fill in
# "tag" to also attach the jar to that existing release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the jar to (leave empty for a test build only)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26 # arm64; the native code uses macOS 26 SDK APIs (MetalFX frame interpolation)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-}"; [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          if [ -n "$tag" ]; then
            v="${tag#v}"
            # semver 2.0: MAJOR.MINOR.PATCH with an optional dot-separated pre-release, e.g. 1.0.0-alpha.7, 1.2.3-rc.1, 1.2.3
            if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
              echo "::error::Tag '$tag' is not a semantic version. Use vMAJOR.MINOR.PATCH[-prerelease], e.g. v1.0.0-alpha.7 or v1.0.1."
              exit 1
            fi
          else
            v="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          # mod version as the game's log shows it, in the usual Fabric style "<semver>+mc<minecraft version>"
          # (like sodium 0.9.2+mc26.3, iris 1.11.7+mc26.3); the asset name uses "-" because "+" is not safe in release asset names
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          [ -n "$mc" ] || { echo "::error::minecraft_version not found in gradle.properties"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "modversion=$v+mc$mc" >> "$GITHUB_OUTPUT"
          echo "asset=metal-shaders-$v-mc$mc.jar" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # the jar and fabric.mod.json carry the release version, not upstream mcopt's
          sed -i '' "s/^version = '.*'$/version = '$v+mc$mc'/" metal/build.gradle

      - name: Toolchain
        run: |
          # what built this jar: Xcode, the macOS SDK the native library compiled against, Java, and every Xcode on the runner
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version) at $(xcrun --sdk macosx --show-sdk-path)"
          java -version 2>&1 | head -1
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # Metal / MetalFX / QuartzCore declarations introduced in macOS 27 by any installed SDK (what a 27 SDK would let the native code use)
          for x in /Applications/Xcode*.app; do
            sdk="$x/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
            [ -d "$sdk" ] || continue
            n=$(grep -rhoE "macos\(27[.0-9]*\)" "$sdk/System/Library/Frameworks/Metal.framework/Headers" "$sdk/System/Library/Frameworks/MetalFX.framework/Headers" "$sdk/System/Library/Frameworks/QuartzCore.framework/Headers" 2>/dev/null | wc -l | tr -d ' ')
            echo "$x: $n macOS 27 declarations in Metal/MetalFX/QuartzCore"
            [ "$n" -gt 0 ] && grep -rhE -B2 "macos\(27" "$sdk/System/Library/Frameworks/Metal.framework/Headers" "$sdk/System/Library/Frameworks/MetalFX.framework/Headers" "$sdk/System/Library/Frameworks/QuartzCore.framework/Headers" | grep -E "^(@property|- \(|\+ \(|typedef|MTL_EXPORT|API_AVAILABLE|@interface|@protocol|.*MTL[A-Z][A-Za-z0-9]+)" | head -200 || true
          done

      - name: Build
        run: ./gradlew :metal:build --console=plain

      - name: Package
        run: |
          mkdir dist
          cp "metal/build/libs/metal-${{ steps.v.outputs.modversion }}.jar" "dist/${{ steps.v.outputs.asset }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.asset }}
          path: dist/*.jar

      - name: Publish release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          ASSET: dist/${{ steps.v.outputs.asset }}
        run: |
          v='${{ steps.v.outputs.version }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            pre=""; case "$v" in *alpha*|*beta*|*rc*) pre="--prerelease";; esac
            gh release create "$TAG" "$ASSET" \
              --title "Metal Shaders $v" --generate-notes $pre \
              --notes "Needs Sodium 0.9.2 for Minecraft 26.3 (separate download), Fabric Loader 0.19.5+, Java 25, Apple Silicon Mac on macOS 26+."
          fi
