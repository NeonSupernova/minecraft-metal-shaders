name: Release

# Builds the mod on an Apple Silicon runner (the native Metal library needs clang + the macOS SDK) and, for a version tag,
# publishes metal-shaders-<version>-mc<minecraft>.jar as a GitHub release.
# - Push a tag like v1.0.0-alpha.8 (semantic versioning: vMAJOR.MINOR.PATCH, optional -alpha.N / -beta.N / -rc.N), or make
#   the release in the GitHub UI (which creates the tag): the jar is built and attached.
# - Pull requests to main that touch the mod or the build: a check build (no release); a newer push cancels the older run.
# - Run it by hand (Actions -> Release -> Run workflow): a test build as a workflow artifact; fill in "tag" to publish that
#   release (created at the commit built if it doesn't exist yet).
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['metal/**', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (created at this commit if it doesn't exist; empty = test build only)
        required: false

permissions:
  contents: read

concurrency:
  # one run per PR / branch / tag; a newer push to a PR cancels the older run, releases are never cancelled
  group: release-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26 # arm64; the native code uses macOS 26 SDK APIs (MetalFX frame interpolation)
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
      asset: ${{ steps.v.outputs.asset }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle # Gradle, its dependencies and Loom's Minecraft setup, kept between runs

      - name: Version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-}"; [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          if [ -n "$tag" ]; then
            v="${tag#v}"
            # semver 2.0: MAJOR.MINOR.PATCH with an optional dot-separated pre-release, e.g. 1.0.0-alpha.7, 1.2.3-rc.1, 1.2.3
            if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
              echo "::error::Tag '$tag' is not a semantic version. Use vMAJOR.MINOR.PATCH[-prerelease], e.g. v1.0.0-alpha.7 or v1.0.1."
              exit 1
            fi
          else
            v="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          # mod version as the game's log shows it, in the usual Fabric style "<semver>+mc<minecraft version>"
          # (like sodium 0.9.2+mc26.3, iris 1.11.7+mc26.3); the asset name uses "-" because "+" is not safe in release asset names
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          [ -n "$mc" ] || { echo "::error::minecraft_version not found in gradle.properties"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "modversion=$v+mc$mc" >> "$GITHUB_OUTPUT"
          echo "asset=metal-shaders-$v-mc$mc.jar" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # the jar and fabric.mod.json carry the release version, not upstream mcopt's
          sed -i '' "s/^version = '.*'$/version = '$v+mc$mc'/" metal/build.gradle

      - name: Toolchain
        run: |
          # what builds this jar: Xcode, the macOS SDK the native library compiles against (and how many macOS 27 Metal APIs it
          # declares: 0 until the runner has a macOS 27 SDK), Java
          xcodebuild -version | sed -n 1p # sed reads it all: head closing the pipe early crashes xcodebuild
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          n=$(grep -rhoE "macos\(27[.0-9]*\)" "$sdk/System/Library/Frameworks/"{Metal,MetalFX,QuartzCore}.framework/Headers/ 2>/dev/null | wc -l | tr -d ' ')
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version), $n macOS 27 declarations in Metal/MetalFX/QuartzCore"
          java -version 2>&1 | head -1

      - name: Build
        run: ./gradlew :metal:build --console=plain

      - name: Package
        run: |
          mkdir dist
          cp "metal/build/libs/metal-${{ steps.v.outputs.modversion }}.jar" "dist/${{ steps.v.outputs.asset }}"
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.v.outputs.asset }}
          path: dist/*.jar
          compression-level: 0 # a jar is already a zip
          retention-days: 30

  sdk27:
    # macOS 27 SDK preview (GitHub's xcode-27 image): lists the Metal, MetalFX and QuartzCore APIs new in macOS 27 and
    # compiles the native library against that SDK, so new APIs can be adopted (behind @available) before the default
    # runner moves. Informational: never blocks a build or a release.
    if: github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: macOS 27 APIs
        run: |
          xcodebuild -version | sed -n 1p
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
          for f in Metal MetalFX QuartzCore; do
            h="$sdk/System/Library/Frameworks/$f.framework/Headers/" # trailing /: Headers is a symlink, which BSD grep -r won't enter
            # every macOS availability version the headers use (whatever macro spells it), newest last
            echo "$f availability: $(grep -rhoE 'macos(x)?\(?[ ,]*[0-9]+(\.[0-9]+)*' "$h" 2>/dev/null | grep -oE '[0-9]+(\.[0-9]+)*$' | sort -V | uniq -c | tail -6 | tr -s ' \n' ' ')"
            echo "::group::$f: declarations newer than macOS 26"
            grep -rnE -B3 'macos(x)?[ ,(]*(2[7-9]|[3-9][0-9])(\.[0-9]+)*' "$h" 2>/dev/null | sed "s|$h||" | head -400
            echo "::endgroup::"
          done
          # Metal's header list with sizes and dates: newest first: where new API landed
          ls -lat "$sdk/System/Library/Frameworks/Metal.framework/Headers/" | head -40

      - name: Native library against the macOS 27 SDK
        run: |
          cd metal/src/main/native
          clang -fno-objc-arc -O2 -Wall -arch arm64 -mmacosx-version-min=15.0 -dynamiclib -install_name @rpath/libmcmetal.dylib \
            -framework AppKit -framework CoreGraphics -framework CoreVideo -framework Foundation -framework Metal -framework MetalFX -framework QuartzCore \
            -o "$RUNNER_TEMP/libmcmetal.dylib" mcmetal.m mcterrain.m mcprobe.m mcframegen.m mclod.m lodseam.m lodmesh.c lodnoise.c rec.m mcshade.m mcshadow.m mcwater.m mcvl.m mctaa.m mcdynlight.m mcxdr.m mcclouds.m
          ls -l "$RUNNER_TEMP/libmcmetal.dylib"

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest # only gh calls: no macOS time, and the build job keeps a read-only token
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.asset }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: dist/${{ needs.build.outputs.asset }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            pre=""; case "$VERSION" in *alpha*|*beta*|*rc*) pre="--prerelease";; esac
            # a new tag lands on exactly the commit this jar was built from
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
              --title "Metal Shaders $VERSION" --generate-notes $pre \
              --notes "Needs Sodium 0.9.2 or newer for Minecraft 26.3 (separate download), Fabric Loader 0.19.5+, Java 25, Apple Silicon Mac on macOS 26+."
          fi
